<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Faresniper</title>
        <link rel="stylesheet" href="/tailwind/output.css" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c0392b'/><text x='50' y='72' font-size='60' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>f</text></svg>"
        />
    </head>
    <body class="h-screen flex">
        {{ template "sidebar" .}}
        <main class="p-6 w-full">
            <div class="mb-6">
                <a
                    href="/airlines/{{ .Airline.Iata }}"
                    class="btn btn-ghost btn-sm"
                    >← Back</a
                >
            </div>
            <h1 class="text-2xl font-bold mb-6">Edit {{ .Airline.Name }}</h1>
            <form
                action="/airlines/{{ .Airline.Iata }}"
                method="post"
                class="card bg-base-100 border border-base-content/5 shadow-sm w-full max-w-md"
            >
                <div class="card-body gap-0 p-0">
                    <div
                        class="flex items-center justify-between px-6 py-4 border-b border-base-content/5"
                    >
                        <span
                            class="text-sm text-base-content/50 uppercase tracking-wide font-medium"
                            >IATA</span
                        >
                        <span class="badge badge-outline font-mono">{{ .Airline.Iata }}</span>
                    </div>
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">Name</legend>
                        <input
                            type="text"
                            name="name"
                            class="input w-full"
                            value="{{ .Airline.Name }}"
                        />
                    </fieldset>
                    <div
                        class="flex items-center justify-between px-6 py-4 border-b border-base-content/5"
                    >
                        <span
                            class="text-sm text-base-content/50 uppercase tracking-wide font-medium"
                            >Lowcost</span
                        >
                        <input
                            type="checkbox"
                            name="is_lowcost"
                            class="toggle toggle-primary"
                            {{ if .Airline.IsLowcost }}checked{{ end }}
                        />
                    </div>
                    <div class="px-6 py-4 flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </body>
</html>
