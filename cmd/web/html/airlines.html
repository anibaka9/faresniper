<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Faresniper</title>
        <link rel="stylesheet" href="tailwind/output.css" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c0392b'/><text x='50' y='72' font-size='60' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>f</text></svg>"
        />
    </head>
    <body class="h-screen flex">
        {{ template "sidebar" .}}
        <main class="p-6 w-full">
            <h1 class="text-2xl font-bold mb-6">Airlines</h1>
            <div
                class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100 w-full"
            >
                <table class="table table-hover w-full">
                    <thead>
                        <tr>
                            <th>IATA</th>
                            <th>Name</th>
                            <th>Lowcost</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ range .Airlines }}
                        <tr>
                            <td>
                                <span class="badge badge-outline font-mono"
                                    >{{ .Iata }}</span
                                >
                            </td>
                            <td>{{ .Name }}</td>
                            <td>
                                {{ if .IsLowcost }}
                                <span class="badge badge-success badge-sm"
                                    >Yes</span
                                >
                                {{ else }}
                                <span class="badge badge-ghost badge-sm"
                                    >No</span
                                >
                                {{ end }}
                            </td>
                            <td>
                                <a href="/airlines/{{ .Iata }}" class="btn btn-sm"
                                    >Open</a
                                >
                                <a
                                    href="/airlines/{{ .Iata }}/edit"
                                    class="btn btn-sm"
                                    >Edit</a
                                >
                            </td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
            <div class="py-4 flex justify-end">
                {{ template "pagination" . }}
            </div>
        </main>
    </body>
</html>
