<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>Faresniper</title>
        <link rel="stylesheet" href="./tailwind/output.css" />
    </head>
    <body class="h-screen flex">
        {{ template "sidebar" .}}
        <main class="p-6 w-full">
            <div class="mb-6">
                <a
                    href="/countries/{{ .Country.ID }}"
                    class="btn btn-ghost btn-sm"
                    >← Back</a
                >
            </div>
            <h1 class="text-2xl font-bold mb-6">Edit {{ .Country.Name }}</h1>
            <form
                action="/countries/{{ .Country.ID }}"
                method="post"
                class="card bg-base-100 border border-base-content/5 shadow-sm w-full max-w-md"
            >
                <div class="card-body gap-0 p-0">
                    <div
                        class="flex items-center justify-between px-6 py-4 border-b border-base-content/5"
                    >
                        <span
                            class="text-sm text-base-content/50 uppercase tracking-wide font-medium"
                            >ID</span
                        >
                        <span class="font-mono">{{ .Country.ID }}</span>
                    </div>
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">Name</legend>
                        <input
                            type="text"
                            name="name"
                            class="input w-full"
                            value="{{ .Country.Name }}"
                        />
                    </fieldset>
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">Code</legend>
                        <input
                            type="text"
                            name="country_code"
                            class="input w-full font-mono"
                            value="{{ .Country.CountryCode }}"
                        />
                    </fieldset>
                    <div class="px-6 py-4 flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </body>
</html>
