<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/" />
        <title>Faresniper</title>
        <link rel="stylesheet" href="./tailwind/output.css" />
    </head>
    <body class="h-screen flex">
        {{ template "sidebar" .}}
        <main class="p-6 w-full">
            <div class="mb-6">
                <a href="/routes/{{ .Route.ID }}" class="btn btn-ghost btn-sm">← Back</a>
            </div>
            <h1 class="text-2xl font-bold mb-6">Edit Route #{{ .Route.ID }}</h1>
            <form
                action="/routes/{{ .Route.ID }}"
                method="post"
                class="card bg-base-100 border border-base-content/5 shadow-sm w-full max-w-md"
            >
                <div class="card-body gap-0 p-0">
                    <div
                        class="flex items-center justify-between px-6 py-4 border-b border-base-content/5"
                    >
                        <span
                            class="text-sm text-base-content/50 uppercase tracking-wide font-medium"
                            >ID</span
                        >
                        <span class="font-mono">{{ .Route.ID }}</span>
                    </div>
                    <fieldset class="fieldset px-6 py-4 border-b border-base-content/5">
                        <legend class="fieldset-legend">From</legend>
                        <select name="airport_from_id" class="select w-full">
                            {{ range .Airports }}
                            <option
                                value="{{ .ID }}"
                                {{ if eq .ID $.Route.AirportFromID }}selected{{ end }}
                            >{{ .CityName }} — {{ .Iata }}</option>
                            {{ end }}
                        </select>
                    </fieldset>
                    <fieldset class="fieldset px-6 py-4 border-b border-base-content/5">
                        <legend class="fieldset-legend">To</legend>
                        <select name="airport_to_id" class="select w-full">
                            {{ range .Airports }}
                            <option
                                value="{{ .ID }}"
                                {{ if eq .ID $.Route.AirportToID }}selected{{ end }}
                            >{{ .CityName }} — {{ .Iata }}</option>
                            {{ end }}
                        </select>
                    </fieldset>
                    <fieldset class="fieldset px-6 py-4 border-b border-base-content/5">
                        <legend class="fieldset-legend">Airline</legend>
                        <select name="airline_id" class="select w-full">
                            {{ range .Airlines }}
                            <option
                                value="{{ .ID }}"
                                {{ if eq .ID $.Route.AirlineID }}selected{{ end }}
                            >{{ .Name }} ({{ .Iata }})</option>
                            {{ end }}
                        </select>
                    </fieldset>
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">FlightsFrom ID</legend>
                        <input
                            type="number"
                            name="flightsfrom_id"
                            class="input w-full font-mono"
                            value="{{ .Route.FlightsfromID }}"
                        />
                    </fieldset>
                    <div
                        class="flex items-center justify-between px-6 py-4 border-b border-base-content/5"
                    >
                        <span
                            class="text-sm text-base-content/50 uppercase tracking-wide font-medium"
                            >Active</span
                        >
                        <input
                            type="checkbox"
                            name="is_active"
                            class="toggle toggle-primary"
                            {{ if .Route.IsActive }}checked{{ end }}
                        />
                    </div>
                    <div class="px-6 py-4 flex justify-end">
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </div>
            </form>
        </main>
    </body>
</html>
