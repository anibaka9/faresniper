<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Faresniper</title>
        <link rel="stylesheet" href="/tailwind/output.css" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c0392b'/><text x='50' y='72' font-size='60' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>f</text></svg>"
        />
    </head>
    <body class="h-screen flex">
        {{ template "sidebar" .}}
        <main class="p-6 w-full">
            <div class="mb-6">
                <a href="/watchedroutes" class="btn btn-ghost btn-sm">← Back</a>
            </div>
            <h1 class="text-2xl font-bold mb-6">New Watched Route</h1>
            <form
                action="/watchedroutes"
                method="post"
                class="card bg-base-100 border border-base-content/5 shadow-sm w-full max-w-md"
            >
                <div class="card-body gap-0 p-0">
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">Origin</legend>
                        <select name="origin_iata" class="select w-full">
                            {{ range .Airports }}
                            <option value="{{ .Iata }}">
                                {{ .Iata }} {{ .CityName }}
                            </option>
                            {{ end }}
                        </select>
                    </fieldset>
                    <fieldset
                        class="fieldset px-6 py-4 border-b border-base-content/5"
                    >
                        <legend class="fieldset-legend">Origin</legend>
                        <select name="origin_iata" class="select w-full">
                            {{ range .Airports }}
                            <option value="{{ .Iata }}">
                                {{ .Iata }} {{ .CityName }}
                            </option>
                            {{ end }}
                        </select>
                    </fieldset>
                    <div class="px-6 py-4 flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </body>
</html>
